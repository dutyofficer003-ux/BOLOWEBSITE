    }

    function renderIntelligenceFeed(articles) {
        const feed = document.getElementById('intelligence-feed');
        feed.innerHTML = '';
        
        const usedTitles = new Set();
        let displayedCount = 0;

        for (const item of articles) {
            if (displayedCount >= 8) break; // STOP AT 8
            if (usedTitles.has(item.title)) continue; // SKIP DUPLICATES

            usedTitles.add(item.title);
            
            const card = document.createElement('div');
            card.className = 'intelligence-card';
            card.style.cssText = `
                margin: 20px 0;
                border-left: 4px solid #FFD700;
                background: linear-gradient(135deg, rgba(0,0,0,0.8) 0%, rgba(30,30,30,0.9) 100%);
                border-radius: 15px;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                transition: all 0.3s ease;
            `;
            
            // This forces your local image to appear immediately
            const localPath = getStrictFilePath(item, displayedCount);
            
            card.innerHTML = `
                <div style="position:relative; height:250px; background:#1a1a1a;">
                    <img src="${localPath}" style="width:100%; height:250px; object-fit:cover;" data-article-index="${displayedCount}" onerror="handleImageError(this, '${item.title.replace(/'/g, '\\\'')}')">
                </div>
                <div style="padding:20px;">
                    <h3 style="color:#FFD700; margin-bottom:10px;" data-translate>${item.title}</h3>
                    <p style="color:#ffffff; margin-bottom:15px;" data-translate>${item.description || 'Monitoring Intelligence Feed...'}</p>
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="color:#a0a0a0; font-size:0.8rem;" data-translate>${new Date(item.publishedAt || Date.now()).toLocaleDateString()}</span>
                        <a href="#" onclick="handleAccessIntel(event, '${item.url || '#'}', '${item.fallbackUrl || item.url || '#'}')" target="_blank" style="background:#FFD700; color:#000; padding:8px 15px; text-decoration:none; border-radius:5px; font-weight:bold;">ACCESS INTEL</a>
                    </div>
                </div>
            `;
            
            feed.appendChild(card);
            displayedCount++;
        }
    }

    // Local Intelligence Database System - No External API Calls

    // Video Glitch Effect System
    let glitchInterval;
    let glitchTimeout;
    
    function triggerGlitch() {
        const video = document.getElementById('glitch-video');
        const body = document.body;
        
        // Clear any existing timeouts
        clearTimeout(glitchTimeout);
        clearInterval(glitchInterval);
        
        // Set up movie-style realistic glitch intervals
        glitchInterval = setInterval(() => {
            // Longer, more dramatic glitch duration like in movies
            const glitchDuration = Math.random() * 1500 + 800; // 800ms to 2.3 seconds
            
            // Start dramatic glitch
            video.style.opacity = '0.7'; // More visible and dramatic
            video.play();
            body.classList.add('world-glitch-active');
            
            // Add visual tearing effect during glitch
            const tearCount = Math.floor(Math.random() * 4) + 2; // 2-5 tears
            for (let i = 0; i < tearCount; i++) {
                setTimeout(() => {
                    // Random visual tear
                    body.style.transform = `translateX(${Math.random() * 20 - 10}px) skewX(${Math.random() * 10 - 5}deg)`;
                    
                    // Reset tear
                    setTimeout(() => {
                        body.style.transform = '';
                    }, Math.random() * 200 + 50);
                }, Math.random() * glitchDuration);
            }
            
            // Stop dramatic glitch
            setTimeout(() => {
                video.style.opacity = '0';
                video.pause();
                body.classList.remove('world-glitch-active');
                body.style.transform = ''; // Ensure clean reset
            }, glitchDuration);
            
        }, Math.random() * 12000 + 8000); // 8-20 seconds between glitches (less frequent)
    }
    
    // Initialize the Local Intelligence Database System
    document.addEventListener('DOMContentLoaded', async () => {
        console.log('🚀 Loading Local Intelligence Database...');
        
        // Start video glitch effect after page loads
        setTimeout(() => {
            triggerGlitch();
        }, 2000);
        
        // Also trigger glitch on any click for dramatic effect
        document.addEventListener('click', () => {
            if (Math.random() > 0.7) { // 30% chance on any click
                triggerGlitch();
            }
        });
        
        try {
            // Fetch from local intelligence.json file
            const response = await fetch('intelligence.json');
            if (!response.ok) {
                throw new Error('Failed to load intelligence database');
            }
            
            const intelligenceData = await response.json();
            console.log(`✅ Loaded ${intelligenceData.length} intelligence reports from local database`);
            
            // Display 8 random articles from the local database
            const shuffledArticles = intelligenceData.sort(() => Math.random() - 0.5);
            const selectedArticles = shuffledArticles.slice(0, 8);
            
            renderIntelligenceFeed(selectedArticles);
            
        } catch (error) {
            console.error('❌ Failed to load local intelligence database:', error);
            
            // Fallback to basic articles if JSON fails to load
            const fallbackArticles = [
                {
                    title: "Intelligence System Offline",
                    description: "Local intelligence database unavailable. System initializing...",
                    entity: "War",
                    url: "#",
                    publishedAt: new Date().toISOString()
                }
            ];
            
            renderIntelligenceFeed(fallbackArticles);
        }
    });
</script>
