<!DOCTYPE html>
<html>
<head>
    <style id="early-anti-flash">html { display: none !important; }</style>
    <script src="/local-router.js"></script>
    <script src="security.js"></script>
    <title>Formspree Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <h1 data-translate>Formspree Email Test</h1>
    <p data-translate>This is a simple test to verify Formspree is sending emails to your Gmail.</p>
    
    <form action="https://formspree.io/f/xojjagee" method="POST">
        <label for="name" data-translate>Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="email" data-translate>Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="message" data-translate>Message:</label><br>
        <textarea id="message" name="message" required></textarea><br><br>
        
        <button type="submit" data-translate>Send Test Email</button>
    </form>
    <script src="global-audio.js"></script>
    <script src="alladin-engine.js"></script>
    <!-- ALLADIN Floating Components -->
    <div class="alladin-trigger hidden" id="alladin-badge">
        <span>?</span>
    </div>

</html>
