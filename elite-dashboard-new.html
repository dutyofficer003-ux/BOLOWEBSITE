<!DOCTYPE html>
<html lang="en">
<head>
    <style id="early-anti-flash">html { display: none !important; }</style>
    <script src="/local-router.js"></script>
    <script src="security.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Dashboard | Illuminati</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --bg-tertiary: #334155;
            --text-primary: #F8FAFC;
            --text-secondary: #CBD5E1;
            --gold-color: #F3BA2F;
            --gold-hover: #FCD34D;
            --success-color: #10B981;
            --error-color: #EF4444;
            --border-color: #475569;
            --shadow-color: rgba(0, 0, 0, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        /* Header Section */
        .header-section {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .balance-display {
            margin-bottom: 30px;
        }

        .balance-label {
            font-size: 1.2rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .total-balance {
            font-size: 4rem;
            font-weight: 900;
            color: var(--gold-color);
            text-shadow: 0 0 30px rgba(243, 186, 47, 0.3);
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .balance-change {
            font-size: 1rem;
            color: var(--success-color);
            margin-bottom: 30px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .action-btn {
            background: var(--gold-color);
            color: var(--bg-primary);
            border: none;
            border-radius: 12px;
            padding: 18px 30px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(243, 186, 47, 0.3);
        }

        .action-btn:hover:not(:disabled) {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(243, 186, 47, 0.4);
        }

        .action-btn:disabled {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .withdraw-btn {
            background: linear-gradient(135deg, var(--gold-color), var(--gold-hover));
        }

        /* Status Grid */
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .status-card {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .status-icon {
            font-size: 2.5rem;
            color: var(--gold-color);
            margin-bottom: 15px;
        }

        .status-title {
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .status-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .status-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* Recent Activity */
        .activity-section {
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .view-all-btn {
            background: transparent;
            color: var(--gold-color);
            border: 1px solid var(--gold-color);
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-all-btn:hover {
            background: var(--gold-color);
            color: var(--bg-primary);
        }

        .activity-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            border-left: 4px solid var(--success-color);
        }

        .activity-info {
            flex: 1;
        }

        .activity-type {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
        }

        .activity-member {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .activity-amount {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--success-color);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-secondary);
            border: 2px solid var(--gold-color);
            border-radius: 12px;
            padding: 15px 20px;
            min-width: 300px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            animation: slideInRight 0.5s ease-out;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast-icon {
            color: var(--gold-color);
            font-size: 1.2rem;
        }

        .toast-content {
            flex: 1;
        }

        .toast-message {
            color: var(--text-primary);
            font-weight: 500;
            margin-bottom: 5px;
        }

        .toast-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            z-index: 100;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.3);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 10px;
            border-radius: 10px;
        }

        .nav-item:hover {
            color: var(--gold-color);
            background: rgba(243, 186, 47, 0.1);
        }

        .nav-item.active {
            color: var(--gold-color);
        }

        .nav-icon {
            font-size: 1.5rem;
        }

        .nav-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Animations */
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideOutRight {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(100px);
            }
        }

        /* Security Badge */
        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success-color);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.8rem;
            color: var(--success-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .security-badge i {
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .dashboard-container {
                padding: 15px;
            }

            .total-balance {
                font-size: 3rem;
            }

            .action-buttons {
                grid-template-columns: 1fr;
                max-width: 100%;
            }

            .status-grid {
                grid-template-columns: 1fr;
            }

            .bottom-nav {
                padding: 10px 0;
            }

            .nav-icon {
                font-size: 1.3rem;
            }

            .nav-label {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header Section -->
        <div class="header-section">
            <div class="balance-display">
                <div class="balance-label">Total Balance</div>
                <div class="total-balance" id="totalBalance">$0.00</div>
                <div class="balance-change" id="balanceChange">+$0.00 (0.00%)</div>
            </div>
            <div class="action-buttons">
                <button class="action-btn withdraw-btn" id="withdrawBtn" onclick="handleWithdrawal()" data-translate>
                    <i class="fas fa-arrow-up"></i> Withdraw
                </button>
                <button class="action-btn" onclick="window.location.href='marketplace.html'" data-translate>
                    <i class="fas fa-plus"></i> Add Funds
                </button>
            </div>
        </div>

        <!-- Status Grid -->
        <div class="status-grid">
            <div class="status-card">
                <div class="status-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <div class="status-title">Security Status</div>
                <div class="status-value" id="securityStatus">ENCRYPTED</div>
                <div class="status-description">
                    <div class="security-badge">
                        <i class="fas fa-lock"></i> Encryption Active
                    </div>
                </div>
            </div>
            <div class="status-card">
                <div class="status-icon">
                    <i class="fas fa-crown"></i>
                </div>
                <div class="status-title">Account Level</div>
                <div class="status-value" id="accountLevel">ELITE</div>
                <div class="status-description">Full Access Granted</div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="activity-section">
            <div class="section-header">
                <div class="section-title">Recent Activity</div>
                <button class="view-all-btn" data-translate>View All</button>
            </div>
            <div class="activity-list" id="activityList">
                <!-- Activity items will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home nav-icon"></i>
            <span class="nav-label" data-translate>Home</span>
        </a>
        <a href="elite-dashboard.html" class="nav-item active">
            <i class="fas fa-wallet nav-icon"></i>
            <span class="nav-label" data-translate>Wallet</span>
        </a>
        <a href="#" class="nav-item" onclick="openSettings()">
            <i class="fas fa-cog nav-icon"></i>
            <span class="nav-label" data-translate>Settings</span>
        </a>
    </nav>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCO174C8QbyOodW1e5aQ5PW2pWJ01tO7jE",
            authDomain: "illuminati---oversight.firebaseapp.com",
            projectId: "illuminati---oversight",
            storageBucket: "illuminati---oversight.firebasestorage.app",
            messagingSenderId: "307854810652",
            appId: "1:307854810652:web:196f634b4f0ebf4be949d9"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Global variables
        let currentBalance = 0;
        let approvalDate = null;
        let withdrawalEnabled = false;
        let userEmail = localStorage.getItem('gate_email') || '';

        // Growth Logic: Balance climbs from $0 to $500,000 over 6 months
        function calculateGrowthBalance() {
            if (!approvalDate) return 0;
            
            const now = new Date();
            const approved = new Date(approvalDate);
            const daysPassed = Math.floor((now - approved) / (1000 * 60 * 60 * 24));
            
            // Calculate target: $500,000 over 180 days (6 months)
            const targetAmount = 500000;
            const targetDays = 180;
            
            if (daysPassed >= targetDays) {
                return targetAmount;
            }
            
            // Linear growth calculation
            const growthRate = targetAmount / targetDays;
            return Math.min(Math.floor(growthRate * daysPassed), targetAmount);
        }

        // Update balance display
        function updateBalance() {
            currentBalance = calculateGrowthBalance();
            const previousBalance = currentBalance - (currentBalance * 0.001); // Small increment for display
            const change = currentBalance - previousBalance;
            const changePercent = previousBalance > 0 ? (change / previousBalance) * 100 : 0;
            
            document.getElementById('totalBalance').textContent = `$${currentBalance.toLocaleString()}.00`;
            document.getElementById('balanceChange').textContent = `${change >= 0 ? '+' : ''}$${Math.abs(change).toLocaleString()}.00 (${changePercent >= 0 ? '+' : ''}${changePercent.toFixed(2)}%)`;
        }

        // Dual-Lock Withdrawal Logic
        function checkWithdrawalEligibility() {
            if (!approvalDate) {
                return { eligible: false, message: 'Account not approved' };
            }
            
            const now = new Date();
            const approved = new Date(approvalDate);
            const daysPassed = Math.floor((now - approved) / (1000 * 60 * 60 * 24));
            
            // Check both conditions: 180 days passed AND admin override enabled
            const timeEligible = daysPassed >= 180;
            const adminEligible = withdrawalEnabled;
            
            if (timeEligible && adminEligible) {
                return { eligible: true, message: 'Withdrawal available' };
            } else {
                let message = 'Security Protocol: Withdrawal access currently restricted. Contact your handler.';
                if (!timeEligible) {
                    message = `Security Protocol: ${180 - daysPassed} days remaining until withdrawal access.`;
                }
                if (!adminEligible) {
                    message = 'Account Under Audit: Security clearance required for withdrawals.';
                }
                return { eligible: false, message };
            }
        }

        function handleWithdrawal() {
            const eligibility = checkWithdrawalEligibility();
            
            if (!eligibility.eligible) {
                alert(eligibility.message);
                return;
            }
            
            // Proceed with withdrawal
            window.location.href = 'marketplace.html';
        }

        // Load user data
        function loadUserData() {
            if (!userEmail) {
                window.location.replace('account-gate.html');
                return;
            }
            
            db.collection('members').doc(userEmail).get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        approvalDate = data.approvalDate;
                        withdrawalEnabled = data.withdrawalEnabled || false;
                        
                        // Update UI
                        updateBalance();
                        updateSecurityStatus();
                        loadRecentActivity();
                    } else {
                        window.location.replace('account-gate.html');
                    }
                })
                .catch((error) => {
                    console.error('Error loading user data:', error);
                });
        }

        function updateSecurityStatus() {
            const eligibility = checkWithdrawalEligibility();
            const statusElement = document.getElementById('securityStatus');
            
            if (eligibility.eligible) {
                statusElement.textContent = 'VERIFIED';
                statusElement.style.color = 'var(--success-color)';
            } else {
                statusElement.textContent = 'RESTRICTED';
                statusElement.style.color = 'var(--error-color)';
            }
        }

        // Fake Notification Engine
        function showNotification(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            
            const icon = type === 'withdrawal' ? 'fa-arrow-up' : 'fa-coins';
            const time = new Date().toLocaleTimeString();
            
            toast.innerHTML = `
                <div class="toast-icon">
                    <i class="fas ${icon}"></i>
                </div>
                <div class="toast-content">
                    <div class="toast-message">${message}</div>
                    <div class="toast-time">${time}</div>
                </div>
            `;
            
            container.appendChild(toast);
            
            // Auto-remove after 5 seconds
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.5s ease-out forwards';
                setTimeout(() => {
                    container.removeChild(toast);
                }, 500);
            }, 5000);
        }

        // Generate fake notifications
        function generateFakeNotification() {
            const names = ['Alpha88', 'Elite_Member', 'Phoenix77', 'Shadow_Broker', 'Crypto_King', 'Golden_Eagle', 'Silver_Fox', 'Diamond_Hands', 'Ice_Cold', 'Fire_Walker'];
            const randomName = names[Math.floor(Math.random() * names.length)];
            const randomAmount = Math.floor(Math.random() * 13000) + 2000;
            const methods = ['MTN Momo', 'M-Pesa', 'Bank Transfer', 'Orange Money', 'Crypto Wallet'];
            const randomMethod = methods[Math.floor(Math.random() * methods.length)];
            
            const messages = [
                `User @${randomName} just withdrew $${randomAmount.toLocaleString()} via ${randomMethod}`,
                `User @${randomName} just linked a Visa Platinum Card`,
                `User @${randomName} just received System Grant of $${randomAmount.toLocaleString()}`,
                `User @${randomName} just upgraded to Platinum Level`
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            showNotification(randomMessage, Math.random() > 0.5 ? 'withdrawal' : 'info');
        }

        // Load Recent Activity
        function loadRecentActivity() {
            const activityList = document.getElementById('activityList');
            
            // Generate fake system grants
            const fakeActivities = [
                { type: 'System Grant', member: 'Member_122', amount: 5000, time: '2 hours ago' },
                { type: 'System Grant', member: 'Elite_Pro', amount: 8500, time: '5 hours ago' },
                { type: 'System Grant', member: 'Phoenix_77', amount: 12000, time: '1 day ago' },
                { type: 'System Grant', member: 'Crypto_King', amount: 3000, time: '2 days ago' },
                { type: 'System Grant', member: 'Golden_Eagle', amount: 7500, time: '3 days ago' }
            ];
            
            activityList.innerHTML = fakeActivities.map(activity => `
                <div class="activity-item">
                    <div class="activity-info">
                        <div class="activity-type">${activity.type}</div>
                        <div class="activity-member">${activity.member}</div>
                    </div>
                    <div class="activity-amount">+$${activity.amount.toLocaleString()}</div>
                </div>
            `).join('');
        }

        // Update balance every few minutes
        function startBalanceUpdates() {
            updateBalance();
            setInterval(updateBalance, 180000); // Update every 3 minutes
        }

        // Start notification engine
        function startNotificationEngine() {
            // Show first notification immediately
            setTimeout(generateFakeNotification, 2000);
            
            // Then show notifications every 3-7 minutes
            setInterval(() => {
                const delay = Math.random() * 240000 + 180000; // 3-7 minutes
                setTimeout(generateFakeNotification, delay);
            }, 300000); // Check every 5 minutes
        }

        function openSettings() {
            alert('Settings panel coming soon...');
        }

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', () => {
            loadUserData();
            startBalanceUpdates();
            startNotificationEngine();
        });
    </script>
    <script src="global-audio.js"></script>
</body>
</html>
